name: pipeline

# Daily prod run, started by the dispatch Lambda at the end of the Step
# Functions extract workflow (repository_dispatch, type pipeline_run), or
# manually for reruns. No cron: GitHub's 60-day inactivity shutoff of
# scheduled workflows never applies. repository_dispatch runs the copy of
# this file on the default branch.
#
#   COPY INTO RAW -> dbt source freshness -> dbt build -> manifest upload
#   -> (only if all passed) JSON export + row-count checks -> Vercel deploy
#   -> dbt docs to GitHub Pages
#
# Steps marked TODO(dbt) are skipped until transform/dbt_project.yml exists.
#
# Configuration (GitHub environment "prod"):
#   variables: AWS_REGION, AWS_PIPELINE_ROLE_ARN, DATA_BUCKET, ALERTS_TOPIC_ARN,
#              SNOWFLAKE_DATABASE, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_LOADER_ROLE,
#              SNOWFLAKE_TRANSFORMER_ROLE
#   secrets:   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY,
#              VERCEL_DEPLOY_HOOK_URL
on:
  repository_dispatch:
    types: [pipeline_run]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Call the Vercel deploy hook after a successful export"
        type: boolean
        default: true

permissions:
  contents: read

# One prod run at a time; never cancel a run that may be mid-export.
concurrency:
  group: pipeline-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DATA_BUCKET: ${{ vars.DATA_BUCKET }}
  SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  DBT_PROJECT_DIR: transform
  # TODO(dbt): final list of app marts and the export schema version.
  EXPORT_MARTS: mart_new_openings
  EXPORT_SCHEMA_VERSION: "1"
  PYTHON_VERSION: "3.12"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC to AWS
    outputs:
      docs: ${{ steps.docs.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Run context
        id: ctx
        run: |
          run_date="$(TZ=America/Los_Angeles date +%F)"
          echo "RUN_DATE=${run_date}" >> "$GITHUB_ENV"
          if [ -f "${DBT_PROJECT_DIR}/dbt_project.yml" ]; then
            echo "dbt=true" >> "$GITHUB_OUTPUT"
          else
            echo "dbt=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TODO(dbt): ${DBT_PROJECT_DIR}/dbt_project.yml not found; dbt, export and deploy steps are skipped."
          fi
          echo "event=${GITHUB_EVENT_NAME} run_date=${run_date} run_id=${RUN_ID}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pipeline-${{ github.run_id }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6

      - name: Install Snowflake CLI
        run: uv tool install snowflake-cli

      # TODO(dbt): install from a lockfile in transform/ instead.
      - name: Install dbt
        if: steps.ctx.outputs.dbt == 'true'
        run: uv tool install --with dbt-snowflake dbt-core

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/snowflake_key.p8"
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: COPY INTO RAW
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_LOADER_ROLE }}
        run: |
          envsubst '${SNOWFLAKE_DATABASE}' < infra/sql/copy_into_raw.sql > "${RUNNER_TEMP}/copy_into_raw.sql"
          infra/scripts/snow.sh -f "${RUNNER_TEMP}/copy_into_raw.sql"

      # TODO(dbt): transform/profiles.yml must read SNOWFLAKE_ACCOUNT,
      # SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY_PATH, SNOWFLAKE_ROLE,
      # SNOWFLAKE_WAREHOUSE and SNOWFLAKE_DATABASE via env_var().
      - name: dbt deps
        if: steps.ctx.outputs.dbt == 'true'
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt source freshness
        if: steps.ctx.outputs.dbt == 'true'
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_TRANSFORMER_ROLE }}
        run: dbt source freshness --target prod

      - name: dbt build
        if: steps.ctx.outputs.dbt == 'true'
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_TRANSFORMER_ROLE }}
        run: dbt build --target prod

      # Used by ci.yml for state:modified+ --defer builds.
      - name: Upload prod manifest
        if: steps.ctx.outputs.dbt == 'true'
        run: |
          aws s3 cp --only-show-errors "${DBT_PROJECT_DIR}/target/manifest.json" \
            "s3://${DATA_BUCKET}/dbt-artifacts/prod/manifest.json"

      # Only reached if every step above passed.
      - name: Export app marts to JSON and publish exports/latest/
        if: steps.ctx.outputs.dbt == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_TRANSFORMER_ROLE }}
        run: infra/scripts/export_marts.sh

      - name: Trigger Vercel deploy hook
        if: steps.ctx.outputs.dbt == 'true' && github.event.inputs.deploy != 'false'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST -o /dev/null "${VERCEL_DEPLOY_HOOK_URL}"
          echo "Vercel deploy hook called."

      - name: dbt docs generate
        id: docs
        if: steps.ctx.outputs.dbt == 'true'
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_TRANSFORMER_ROLE }}
        run: |
          dbt docs generate --target prod
          mkdir -p "${RUNNER_TEMP}/dbt-docs"
          cp target/index.html target/manifest.json target/catalog.json "${RUNNER_TEMP}/dbt-docs/"

      - name: Upload dbt docs artifact
        if: steps.docs.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/dbt-docs

      - name: Remove Snowflake private key
        if: always()
        run: rm -f "${RUNNER_TEMP}/snowflake_key.p8"

      - name: Alert on failure
        if: failure()
        env:
          ALERTS_TOPIC_ARN: ${{ vars.ALERTS_TOPIC_ARN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aws sns publish \
            --topic-arn "${ALERTS_TOPIC_ARN}" \
            --subject "[kc-new-eats] GitHub pipeline failed" \
            --message "pipeline.yml run ${RUN_ID} (${GITHUB_EVENT_NAME}) failed: ${RUN_URL}" \
            --output text > /dev/null || echo "::warning::Could not publish the SNS alert (GitHub's failure email still applies)."

  # TODO(dbt): enable GitHub Pages (Settings > Pages > Source: GitHub Actions).
  publish-docs:
    needs: pipeline
    if: needs.pipeline.outputs.docs == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

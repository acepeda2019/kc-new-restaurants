[project]
name = "kc-new-eats-ingestion"
version = "0.1.0"
description = "Extract layer for King County New Eats: Socrata and Census geocoder extractors landed as-received in S3 raw, plus the GitHub dispatch step."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "requests>=2.32",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "moto[s3,secretsmanager]>=5.0",
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

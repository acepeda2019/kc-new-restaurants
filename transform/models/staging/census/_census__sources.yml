version: 2

sources:
  - name: census
    description: Census batch geocoder files landed by `ingestion/sources/census_geocoder.py`. Every file is immutable.
    tables:
      - name: geocoder_responses
        description: "Every response line, as received. Ragged CSV: 8 fields on Match, 3 on No_Match/Tie; coordinates are one \"lon,lat\" field."
        meta:
          external_location: >-
            read_csv('{{ var("raw_root") }}/census_geocoder/*/*/response_*.csv', header = false, null_padding = true,
            all_varchar = true, filename = true, quote = '"',
            names = ['geocode_key', 'input_address', 'match_status', 'match_type', 'matched_address', 'lon_lat', 'tiger_line_id', 'side'])
      - name: geocoder_chunks
        description: One record per geocoder call (requested_at, benchmark). A response may lack one; then its dt= date is used.
        meta:
          external_location: >-
            read_json_objects('{{ var("raw_root") }}/census_geocoder/*/*/chunk_*.json', filename = true)

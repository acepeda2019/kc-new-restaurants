version: 2

models:
  - name: stg_kc__inspection_violations
    description: "Grain: one row per violation in the latest KC pull (an inspection with no violation has one row with null violation fields). Renamed and cast only."
    columns:
      - name: violation_key
        description: md5 of inspection_serial_num and violation_description (KC has no violation id).
        data_tests: [unique, not_null]
      - name: inspection_serial_num
        data_tests: [not_null]
      - name: business_id
        data_tests: [not_null]
      - name: inspection_date
        data_tests: [not_null]
      - name: violation_type
        data_tests:
          - accepted_values:
              arguments: {values: [RED, BLUE]}

  - name: stg_kc__inspections
    description: "Grain: one row per inspection (inspection_serial_num) in the latest KC pull."
    columns:
      - name: inspection_serial_num
        data_tests: [unique, not_null]
      - name: business_id
        data_tests: [not_null]
      - name: red_points
        description: Sum of violation_points on RED violations (0 when none).
        data_tests: [not_null]
      - name: inspection_type
        data_tests:
          - accepted_values:
              arguments: {values: ["Routine Inspection/Field Review", "Return Inspection", "Educational Inspection"]}

version: 2

models:
  - name: int_establishments
    description: "Grain: one row per KC business (business_id) in the latest pull. Business attributes, address key and coordinates, first and latest inspection, and the rule category."
    columns:
      - name: business_id
        data_tests: [unique, not_null]
      - name: rule_category
        description: From seeds/classification_rules.csv. Null would mean an unseen classification value.
        data_tests: [not_null]
      - name: geocode_key
        description: md5(street_clean|zip5), rule v1 from ingestion/sources/geocode_key.py. Null when the street normalises to empty.
      - name: latitude
        description: Null for food trucks (no geocoding; the address is a base) and for unmatched addresses.
      - name: businesses_at_address
        description: Businesses with the same geocode_key inspected in the 12 months before the pull (incl. this one). High counts mean a food hall, mall or market.

  - name: int_candidates
    description: "Grain: one row per KC business that could be a new opening. First inspected within 180 days of the pull, not excluded by rules or venue, and not closed by its latest inspection. Input to Claude classification."
    columns:
      - name: business_id
        data_tests: [unique, not_null]
      - name: rule_category
        data_tests:
          - accepted_values:
              arguments: {values: [food_truck, needs_judgment]}
      - name: prior_businesses_at_address
        description: "JSON list of earlier businesses at the same premises whose last inspection fell within 12 months before (to 30 days after) this one's first inspection. Same premises: same address key and not a different unit (macros/address_unit.sql). A differently named business still inspected on or after this one's first inspection is a neighbour that stayed open, so it's left out; a same-name one (score_params.prior_same_name_min) stays, as a re-issued id. Lets Claude tell new_opening, new_concept and ownership_transfer apart."
  - name: int_opening_soon_candidates
    description: "Grain: one row per King County WSLCB notice that counts as a restaurant about to open (counted notice type, any restaurant privilege). Not yet matched to inspections (SAN-47)."
    columns:
      - name: notice_id
        data_tests: [unique, not_null]
      - name: notice_type
        data_tests:
          - accepted_values:
              arguments: {values: ["NEW LICENSE APPLICATION", "CHANGE OF LOCATION"]}
  - name: int_lcb_match_pairs
    description: "Grain: one row per (Opening soon notice, KC business) pair at the same ZIP and street number, with the cleaned-name Jaro-Winkler score and the rule decision: match, review, different_name, or previous_business (first inspected too long before the application)."
    columns:
      - name: pair_id
        data_tests: [unique, not_null]
      - name: name_score
        data_tests:
          - expression_is_true:
              arguments: {expression: "name_score between 0 and 1"}
      - name: decision
        data_tests:
          - accepted_values:
              arguments: {values: [match, review, different_name, previous_business]}
      - name: matched_on
        description: "Which LCB name scored higher against the KC name: trade_name or licensee_name (KC often records the company)."
        data_tests:
          - accepted_values:
              arguments: {values: [trade_name, licensee_name]}
  - name: int_opening_soon
    description: "Grain: one row per Opening soon notice (King County restaurant licence application), with the KC business it opened as, if any: an owner override first, else the best rule match. pairs_for_review counts borderline pairs for the owner to check."
    columns:
      - name: notice_id
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments: {values: [rule, override]}
      - name: opened_on
        data_tests:
          - expression_is_true:
              arguments: {expression: "opened_on is null or opened_business_id is not null"}

unit_tests:
  - name: candidate_priors_skip_other_units_and_open_neighbours_but_keep_reissued_ids
    model: int_candidates
    given:
      - input: ref('int_establishments')
        rows:
          - {business_id: "NEW", business_name: "PIZZA TWIST", address: "100 MAIN ST, 111", geocode_key: "K1", classification: "Seating 0-12", rule_category: "needs_judgment", first_inspection_date: "2026-11-04", latest_inspection_date: "2026-11-04", pulled_on: "2026-11-20", is_venue_excluded: false, is_closed_by_latest_inspection: false}
          - {business_id: "O_OTHER_UNIT", business_name: "APPLE TERIYAKI", address: "100 MAIN ST, 107", geocode_key: "K1", classification: "Seating 0-12", rule_category: "needs_judgment", first_inspection_date: "2021-07-20", latest_inspection_date: "2026-09-23", pulled_on: "2026-11-20", is_venue_excluded: false, is_closed_by_latest_inspection: false}
          - {business_id: "O_SAME_UNIT", business_name: "OLD TACOS", address: "100 MAIN ST, #111", geocode_key: "K1", classification: "Seating 0-12", rule_category: "needs_judgment", first_inspection_date: "2022-01-10", latest_inspection_date: "2026-08-01", pulled_on: "2026-11-20", is_venue_excluded: false, is_closed_by_latest_inspection: false}
          - {business_id: "O_STILL_OPEN", business_name: "BURGER SPOT", address: "100 MAIN ST", geocode_key: "K1", classification: "Seating 0-12", rule_category: "needs_judgment", first_inspection_date: "2023-03-01", latest_inspection_date: "2026-11-10", pulled_on: "2026-11-20", is_venue_excluded: false, is_closed_by_latest_inspection: false}
          - {business_id: "O_REISSUED", business_name: "Pizza Twist, LLC", address: "100 MAIN ST", geocode_key: "K1", classification: "Seating 0-12", rule_category: "needs_judgment", first_inspection_date: "2024-05-01", latest_inspection_date: "2026-11-10", pulled_on: "2026-11-20", is_venue_excluded: false, is_closed_by_latest_inspection: false}
      - input: ref('score_params')
        rows:
          - {window_days: 180, prior_same_name_min: 0.85}
    expect:
      rows:
        - {business_id: "NEW", prior_businesses_at_address: '[{"business_id":"O_REISSUED","name":"Pizza Twist, LLC","classification":"Seating 0-12","first_inspection_date":"2024-05-01","latest_inspection_date":"2026-11-10"},{"business_id":"O_SAME_UNIT","name":"OLD TACOS","classification":"Seating 0-12","first_inspection_date":"2022-01-10","latest_inspection_date":"2026-08-01"}]'}

  - name: lcb_pairs_decide_match_review_previous_and_skip_other_addresses
    model: int_lcb_match_pairs
    given:
      - input: ref('int_opening_soon_candidates')
        rows:
          - {notice_id: "N1", application_date: "2026-11-04", trade_name: "DANTINI DELLO LLC", licensee_name: "DD HOLDINGS LLC", street_address: "704 NW 65TH ST", zip5: "98117"}
          - {notice_id: "N2", application_date: "2026-01-10", trade_name: "HANA KATSU", licensee_name: "C AND R 2026 CORP", street_address: "1200 MAIN ST", zip5: "98004"}
      - input: ref('int_establishments')
        rows:
          - {business_id: "B_SAME", business_name: "Dantini Dello", address: "704 NW 65TH ST", zip5: "98117", first_inspection_date: "2026-12-10"}
          - {business_id: "B_NEIGHBOUR", business_name: "DONATELLO", address: "704 NW 65TH ST STE B", zip5: "98117", first_inspection_date: "2026-12-01"}
          - {business_id: "B_PIZZA", business_name: "DANTE'S PIZZA", address: "704 NW 65TH ST", zip5: "98117", first_inspection_date: "2026-12-01"}
          - {business_id: "B_OLD", business_name: "DANTINI DELLO", address: "704 NW 65TH ST", zip5: "98117", first_inspection_date: "2024-03-01"}
          - {business_id: "B_ELSEWHERE", business_name: "DANTINI DELLO", address: "900 NW 65TH ST", zip5: "98117", first_inspection_date: "2026-12-10"}
          - {business_id: "B_COMPANY", business_name: "C AND R 2026, CORP", address: "1200 MAIN ST", zip5: "98004", first_inspection_date: "2026-06-25"}
      - input: ref('lcb_match_params')
        rows:
          - {name_score_min: 0.85, name_score_review_min: 0.70, inspection_lead_days: 30}
    expect:
      rows:
        - {business_id: "B_SAME", decision: "match", matched_on: "trade_name"}
        - {business_id: "B_COMPANY", decision: "match", matched_on: "licensee_name"}
        - {business_id: "B_NEIGHBOUR", decision: "review", matched_on: "trade_name"}
        - {business_id: "B_PIZZA", decision: "different_name", matched_on: "trade_name"}
        - {business_id: "B_OLD", decision: "previous_business", matched_on: "trade_name"}

  - name: lcb_opening_soon_override_wins_over_rule_and_blank_override_blocks
    model: int_opening_soon
    given:
      - input: ref('int_opening_soon_candidates')
        rows:
          - {notice_id: "N_RULE"}
          - {notice_id: "N_OVERRIDE"}
          - {notice_id: "N_BLOCKED"}
          - {notice_id: "N_NONE"}
      - input: ref('int_lcb_match_pairs')
        rows:
          - {notice_id: "N_RULE", business_id: "B1", first_inspection_date: "2026-12-10", name_score: 0.95, decision: "match"}
          - {notice_id: "N_RULE", business_id: "B9", first_inspection_date: "2026-12-11", name_score: 0.80, decision: "review"}
          - {notice_id: "N_OVERRIDE", business_id: "B2", first_inspection_date: "2026-12-12", name_score: 0.99, decision: "match"}
          - {notice_id: "N_BLOCKED", business_id: "B4", first_inspection_date: "2026-12-14", name_score: 0.99, decision: "match"}
      - input: ref('int_establishments')
        rows:
          - {business_id: "B3", first_inspection_date: "2026-12-20"}
      - input: ref('lcb_match_overrides')
        rows:
          - {notice_id: "N_OVERRIDE", business_id: "B3", note: "owner checked"}
          - {notice_id: "N_BLOCKED", business_id: "", note: "different place"}
    expect:
      rows:
        - {notice_id: "N_RULE", opened_business_id: "B1", opened_on: "2026-12-10", match_method: "rule", pairs_for_review: 1}
        - {notice_id: "N_OVERRIDE", opened_business_id: "B3", opened_on: "2026-12-20", match_method: "override", pairs_for_review: 0}
        - {notice_id: "N_BLOCKED", opened_business_id: null, opened_on: null, match_method: "override", pairs_for_review: 0}
        - {notice_id: "N_NONE", opened_business_id: null, opened_on: null, match_method: null, pairs_for_review: 0}

name: kc_new_eats
version: "0.1.0"
config-version: 2
profile: kc_new_eats

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Root of the raw layer. Always passed on the command line (dbt doesn't render Jinja here):
  #   local:  --vars '{raw_root: data/sample/raw}'
  #   daily:  --vars "{raw_root: s3://$RAW_BUCKET/raw}" (.github/workflows/daily.yml)
  raw_root: "raw_root-not-set--pass-it-with---vars"

models:
  kc_new_eats:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

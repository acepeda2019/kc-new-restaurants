[project]
name = "kc-new-eats-transform"
version = "0.1.0"
description = "dbt project for King County New Eats (dbt-duckdb, reads raw files from S3 or data/sample)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.5",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

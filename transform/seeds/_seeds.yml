version: 2

seeds:
  - name: classification_rules
    description: "Grain: one row per KC classification value (all 15 seen on 2026-11-17). Maps it to a rule category: excluded outright, food_truck, or needs_judgment (Claude decides)."
    columns:
      - name: classification
        data_tests: [unique, not_null]
      - name: rule_category
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [food_truck, needs_judgment, excluded]}
  - name: venue_exclusions
    description: "Grain: one row per geocode_key of a stadium, arena or airport-terminal address. Vendors there are excluded (diners can't simply walk in). Keys from ingestion/sources/geocode_key.py."
    columns:
      - name: geocode_key
        data_tests: [unique, not_null]
  - name: classification_overrides
    description: "Grain: one row per business_id. The owner's decision; it always wins over Claude. Empty until the first review."
    config:
      column_types: {business_id: varchar, category: varchar, opening_type: varchar, replaces_name: varchar, likely_cuisine: varchar, decided_at: date, note: varchar}
    columns:
      - name: business_id
        data_tests: [unique, not_null]
  - name: score_params
    description: "Grain: one row. Scoring weights, window and Claude confidence threshold (ARCHITECTURE.md §6)."
  - name: lcb_privilege_rules
    description: "Grain: one row per WSLCB privilege text (every value seen in the notice window on 2026-11-19). is_restaurant marks the ones Opening soon counts; a notice counts if any of its privileges does. Unseen privileges count as not a restaurant and are flagged by the lcb_unmapped_privileges test."
    config:
      column_types: {privilege: varchar, is_restaurant: boolean, why: varchar}
    columns:
      - name: privilege
        data_tests: [unique, not_null]
      - name: is_restaurant
        data_tests: [not_null]
  - name: lcb_notice_types
    description: "Grain: one row per WSLCB notice type (l_a_type). counts_as_opening: new applications and changes of location yes; assumptions (ownership changes) no. Unseen types don't count and are flagged by the lcb_unmapped_notice_types test."
    config:
      column_types: {notice_type: varchar, counts_as_opening: boolean, why: varchar}
    columns:
      - name: notice_type
        data_tests: [unique, not_null]
      - name: counts_as_opening
        data_tests: [not_null]

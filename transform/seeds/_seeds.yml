version: 2

seeds:
  - name: classification_rules
    description: "Grain: one row per KC classification value (all 15 seen on 2026-11-17). Maps it to a rule category: excluded outright, food_truck, or needs_judgment (Claude decides)."
    columns:
      - name: classification
        data_tests: [unique, not_null]
      - name: rule_category
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [food_truck, needs_judgment, excluded]}
  - name: venue_exclusions
    description: "Grain: one row per geocode_key of a stadium, arena or airport-terminal address. Vendors there are excluded (diners can't simply walk in). Keys from ingestion/sources/geocode_key.py."
    columns:
      - name: geocode_key
        data_tests: [unique, not_null]
  - name: classification_overrides
    description: "Grain: one row per business_id. The owner's decision; it always wins over Claude. Empty until the first review."
    config:
      column_types: {business_id: varchar, category: varchar, opening_type: varchar, replaces_name: varchar, likely_cuisine: varchar, decided_at: date, note: varchar}
    columns:
      - name: business_id
        data_tests: [unique, not_null]
  - name: score_params
    description: "Grain: one row. Scoring weights, window and Claude confidence threshold (ARCHITECTURE.md §6)."
  - name: lcb_privilege_rules
    description: "Grain: one row per WSLCB privilege text (every value seen in the notice window on 2026-11-19). is_restaurant marks the ones Opening soon counts and label is how the app names the licence; a notice counts if any of its privileges does. Unseen privileges count as not a restaurant and are flagged by the lcb_unmapped_privileges test."
    config:
      column_types: {privilege: varchar, is_restaurant: boolean, label: varchar, why: varchar}
    columns:
      - name: privilege
        data_tests: [unique, not_null]
      - name: is_restaurant
        data_tests: [not_null]
  - name: lcb_notice_types
    description: "Grain: one row per WSLCB notice type (l_a_type). counts_as_opening: new applications and changes of location yes; assumptions (ownership changes) no. Unseen types don't count and are flagged by the lcb_unmapped_notice_types test."
    config:
      column_types: {notice_type: varchar, counts_as_opening: boolean, why: varchar}
    columns:
      - name: notice_type
        data_tests: [unique, not_null]
      - name: counts_as_opening
        data_tests: [not_null]
  - name: lcb_match_params
    description: "Grain: one row. Thresholds for matching WSLCB notices to KC businesses: a name score (Jaro-Winkler on cleaned names) at or above name_score_min is a match, between name_score_review_min and that is for review; the KC business must be first inspected no earlier than inspection_lead_days before the licence application (else it's the previous business at the address)."
    config:
      column_types: {name_score_min: double, name_score_review_min: double, inspection_lead_days: integer}
  - name: lcb_match_overrides
    description: "Grain: one row per notice_id. The owner's decision; it always wins over the rules. business_id = the KC business it opened as; empty = never matches. Empty until the first review."
    config:
      column_types: {notice_id: varchar, business_id: varchar, note: varchar}
    columns:
      - name: notice_id
        data_tests: [unique, not_null]
  - name: opening_soon_params
    description: "Grain: one row. max_pending_days: a licence application older than this that never matched a KC inspection drops off Opening soon (median licence-to-first-inspection lead time was 164 days; source card)."
    config:
      column_types: {max_pending_days: integer}
